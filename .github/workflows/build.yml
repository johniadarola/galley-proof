name: Build installers

# Every push to main builds Windows and Mac installers and attaches them to
# a release named after the version in src-tauri/tauri.conf.json.
# Bump that version to make a new release; pushing without a bump refreshes
# the files on the current one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            targets: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Test the file-saving code
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs each build so installed copies can trust the update.
          # Set once in GitHub: Settings > Secrets and variables > Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Galley Proof v__VERSION__'
          releaseBody: |
            Download the installer for your computer from the list below.

            - **Windows:** the file ending in `-setup.exe`. Windows may warn that the app is unrecognized: click **More info**, then **Run anyway**.
            - **Mac:** the file ending in `.dmg`. The first time, right-click the app and choose **Open**.

            Your books are kept in Documents/Galley Proof and are never touched by installing or updating.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
